# Souq Arab EU — public API hostname (api.souq-arab.com).
# HTTP :80 for ACME + proxy; certbot --nginx adds :443 ssl when DNS points to this VPS.
# Railway remains fallback at api.souq-arab.com until DNS A/CNAME swing (separate approval).

upstream souq_api_public_upstream {
    server 127.0.0.1:3002;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.souq-arab.com;

    client_max_body_size 55m;
    client_body_timeout 30s;
    client_header_timeout 15s;
    send_timeout 60s;
    keepalive_timeout 65s;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        allow all;
    }

    location ~* ^/(\.git|\.env|wp-admin|wp-login|phpmyadmin) {
        return 444;
    }

    location = /healthz {
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 200 'ok';
    }

    location = /api/healthz {
        include /etc/nginx/snippets/souq-proxy-params.conf;
        proxy_read_timeout 10s;
        proxy_pass http://souq_api_public_upstream;
        access_log /var/log/souq-arab/nginx-api-public-access.log;
        error_log  /var/log/souq-arab/nginx-api-public-error.log warn;
    }

    location = /api/livez {
        include /etc/nginx/snippets/souq-proxy-params.conf;
        proxy_read_timeout 10s;
        proxy_pass http://souq_api_public_upstream;
        access_log /var/log/souq-arab/nginx-api-public-access.log;
        error_log  /var/log/souq-arab/nginx-api-public-error.log warn;
    }

    location = /api/readyz {
        include /etc/nginx/snippets/souq-proxy-params.conf;
        proxy_read_timeout 15s;
        proxy_pass http://souq_api_public_upstream;
        access_log /var/log/souq-arab/nginx-api-public-access.log;
        error_log  /var/log/souq-arab/nginx-api-public-error.log warn;
    }

    location /api/ws {
        limit_conn souq_conn_per_ip 10;
        proxy_pass http://souq_api_public_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        access_log /var/log/souq-arab/nginx-api-public-access.log;
        error_log  /var/log/souq-arab/nginx-api-public-error.log warn;
    }

    location /api/ {
        limit_req zone=souq_api_general burst=80 nodelay;
        limit_req_status 429;
        limit_conn souq_conn_per_ip 40;
        include /etc/nginx/snippets/souq-proxy-params.conf;
        proxy_read_timeout 60s;
        proxy_pass http://souq_api_public_upstream;
        include /etc/nginx/snippets/souq-security-headers.conf;
        access_log /var/log/souq-arab/nginx-api-public-access.log;
        error_log  /var/log/souq-arab/nginx-api-public-error.log warn;
    }

    location / {
        return 404;
    }
}
