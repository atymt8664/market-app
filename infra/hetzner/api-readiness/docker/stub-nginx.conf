# Infrastructure stub — NOT the Souq production API.
server {
    listen 8080;
    server_name _;

    location = /api/healthz {
        default_type application/json;
        return 200 '{"status":"ok","source":"readiness-stub"}';
    }

    location = /api/livez {
        default_type application/json;
        return 200 '{"status":"ok","source":"readiness-stub"}';
    }

    location = /api/readyz {
        default_type application/json;
        return 200 '{"status":"ready","source":"readiness-stub","checks":{"database":"stub"}}';
    }

    location /api/ {
        default_type application/json;
        return 503 '{"status":"not_ready","message":"readiness-stub: no business routes"}';
    }

    location = /healthz {
        default_type text/plain;
        return 200 'ok';
    }
}
