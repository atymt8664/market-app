# Souq Arab EU — API host layout (Phase 2). No secrets in this file.
# Production API: profile "production" — do NOT start until cutover is approved.
# Readiness stub: profile "readiness-stub" — infrastructure validation only.

name: souq-arab-api

services:
  api:
    profiles: ["production"]
    image: ${SOUQ_API_IMAGE:-ghcr.io/placeholder/souq-api:latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    env_file:
      - ../../config/api.env
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3001/api/healthz 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    # Bind only on loopback when not using host network — documented for future bridge mode.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  api-readiness-stub:
    profiles: ["readiness-stub"]
    image: nginx:1.24-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:8080"
    volumes:
      - ./stub-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/api/healthz 2>/dev/null || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
