kind = "web"
previewPath = "/"
title = "سوق العرب ألمانيا"
version = "1.0.0"
id = "artifacts/souq"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21162

[services.development]
run = "pnpm --filter @workspace/souq run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/souq", "run", "build" ]
publicDir = "artifacts/souq/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21162"
BASE_PATH = "/"
