# Souq Arab EU — Phase 3 hardened reverse proxy (HTTP until DNS/TLS).
# Health probes: exempt from rate limits.

upstream souq_api_upstream {
    server 127.0.0.1:3001;
    keepalive 32;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 55m;
    client_body_timeout 30s;
    client_header_timeout 15s;
    send_timeout 60s;
    keepalive_timeout 65s;

    location ~* ^/(\.git|\.env|wp-admin|wp-login|phpmyadmin) {
        return 444;
    }

    location = /healthz {
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 200 'ok';
    }

    location = /readyz {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 200 '{"status":"ready","layer":"nginx","api_upstream":"127.0.0.1:3001"}';
    }

    location = /api/healthz {
        include /etc/nginx/snippets/souq-proxy-params.conf;
        proxy_read_timeout 10s;
        proxy_pass http://souq_api_upstream;
        access_log /var/log/souq-arab/nginx-api-access.log;
        error_log  /var/log/souq-arab/nginx-api-error.log warn;
    }

    location = /api/livez {
        include /etc/nginx/snippets/souq-proxy-params.conf;
        proxy_read_timeout 10s;
        proxy_pass http://souq_api_upstream;
        access_log /var/log/souq-arab/nginx-api-access.log;
        error_log  /var/log/souq-arab/nginx-api-error.log warn;
    }

    location = /api/readyz {
        include /etc/nginx/snippets/souq-proxy-params.conf;
        proxy_read_timeout 15s;
        proxy_pass http://souq_api_upstream;
        access_log /var/log/souq-arab/nginx-api-access.log;
        error_log  /var/log/souq-arab/nginx-api-error.log warn;
    }

    # Auth / anti-abuse (stricter than app limiters — edge first)
    location ~ ^/api/auth/(signup|login|verify-email|resend-verification|forgot-password|reset-password)/?$ {
        limit_req zone=souq_api_auth burst=8 nodelay;
        limit_req_status 429;
        limit_conn souq_conn_per_ip 20;
        include /etc/nginx/snippets/souq-proxy-params.conf;
        proxy_read_timeout 60s;
        proxy_pass http://souq_api_upstream;
        include /etc/nginx/snippets/souq-security-headers.conf;
        access_log /var/log/souq-arab/nginx-api-access.log;
        error_log  /var/log/souq-arab/nginx-api-error.log warn;
    }

    location ~ ^/api/admin-login(/totp)?$ {
        limit_req zone=souq_api_admin_login burst=5 nodelay;
        limit_req_status 429;
        limit_conn souq_conn_per_ip 10;
        include /etc/nginx/snippets/souq-proxy-params.conf;
        proxy_read_timeout 60s;
        proxy_pass http://souq_api_upstream;
        include /etc/nginx/snippets/souq-security-headers.conf;
        access_log /var/log/souq-arab/nginx-api-access.log;
        error_log  /var/log/souq-arab/nginx-api-error.log warn;
    }

    location ~ ^/api/storage/ {
        limit_req zone=souq_api_upload burst=15 nodelay;
        limit_req_status 429;
        limit_conn souq_conn_per_ip 15;
        client_body_timeout 120s;
        include /etc/nginx/snippets/souq-proxy-params.conf;
        proxy_read_timeout 120s;
        proxy_pass http://souq_api_upstream;
        include /etc/nginx/snippets/souq-security-headers.conf;
        access_log /var/log/souq-arab/nginx-api-access.log;
        error_log  /var/log/souq-arab/nginx-api-error.log warn;
    }

    location ~ ^/api/ai/ {
        limit_req zone=souq_api_ai burst=10 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/souq-proxy-params.conf;
        proxy_read_timeout 60s;
        proxy_pass http://souq_api_upstream;
        include /etc/nginx/snippets/souq-security-headers.conf;
        access_log /var/log/souq-arab/nginx-api-access.log;
        error_log  /var/log/souq-arab/nginx-api-error.log warn;
    }

    location /api/ws {
        limit_conn souq_conn_per_ip 10;
        proxy_pass http://souq_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        access_log /var/log/souq-arab/nginx-api-access.log;
        error_log  /var/log/souq-arab/nginx-api-error.log warn;
    }

    location /api/ {
        if ($souq_reject_empty_ua) { return 403; }
        limit_req zone=souq_api_general burst=80 nodelay;
        limit_req_status 429;
        limit_conn souq_conn_per_ip 40;
        include /etc/nginx/snippets/souq-proxy-params.conf;
        proxy_read_timeout 60s;
        proxy_pass http://souq_api_upstream;
        include /etc/nginx/snippets/souq-security-headers.conf;
        access_log /var/log/souq-arab/nginx-api-access.log;
        error_log  /var/log/souq-arab/nginx-api-error.log warn;
    }

    location / {
        root /var/www/souq-foundation/health;
        try_files $uri $uri/ =404;
    }
}
