name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: API unit tests
        run: pnpm --filter @workspace/api-server run test

      - name: WebSocket URL unit tests
        run: pnpm --filter @workspace/souq run test:ws-url

      - name: PG pool config unit tests
        run: pnpm --filter @workspace/db run test:pool-config

      - name: Build frontend
        run: pnpm --filter @workspace/souq run build

      - name: Home stability unit tests (P9-B)
        run: pnpm --filter @workspace/souq run test:home-stability

      - name: Home regression guards (P9-B)
        run: pnpm --filter @workspace/souq run p9-b:guards

      - name: i18n key check
        run: pnpm --filter @workspace/souq run i18n:check

      - name: P13 index monitoring (local)
        run: pnpm --filter @workspace/souq run index:p13:validate

      - name: P13 CWV readiness (local)
        run: pnpm --filter @workspace/souq run cwv:p13:readiness

      - name: P13-4 discoverability readiness (local)
        run: pnpm --filter @workspace/souq run discoverability:p13:validate
