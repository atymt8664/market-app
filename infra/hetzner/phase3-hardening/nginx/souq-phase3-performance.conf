# Phase 3 — edge performance (safe defaults for API proxy host).
server_tokens off;

open_file_cache max=10000 inactive=30s;
open_file_cache_valid 60s;
open_file_cache_min_uses 2;

# gzip is enabled in /etc/nginx/nginx.conf — do not duplicate here.

# Proxy buffer defaults (tuned for JSON + modest uploads)
proxy_buffer_size 16k;
proxy_buffers 8 32k;
proxy_busy_buffers_size 64k;
