# Souq Arab EU — Phase 2 hybrid reverse proxy (HTTP only until DNS/TLS).
# Host foundation probe: /healthz
# API paths proxied to loopback upstream (production API or readiness stub).

upstream souq_api_upstream {
    server 127.0.0.1:3001;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # VPS / load-balancer foundation (no upstream)
    location = /healthz {
        default_type text/plain;
        return 200 'ok';
    }

    # Nginx-only readiness: proxy layer up (returns 200 even if API returns 503)
    location = /readyz {
        default_type application/json;
        return 200 '{"status":"ready","layer":"nginx","api_upstream":"127.0.0.1:3001"}';
    }

    location = /api/healthz {
        proxy_pass http://souq_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        access_log /var/log/souq-arab/nginx-api-access.log;
        error_log  /var/log/souq-arab/nginx-api-error.log warn;
    }

    location = /api/livez {
        proxy_pass http://souq_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        access_log /var/log/souq-arab/nginx-api-access.log;
        error_log  /var/log/souq-arab/nginx-api-error.log warn;
    }

    location = /api/readyz {
        proxy_pass http://souq_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        access_log /var/log/souq-arab/nginx-api-access.log;
        error_log  /var/log/souq-arab/nginx-api-error.log warn;
    }

    location /api/ {
        proxy_pass http://souq_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering on;
        access_log /var/log/souq-arab/nginx-api-access.log;
        error_log  /var/log/souq-arab/nginx-api-error.log warn;
    }

    # WebSocket upgrade path (inactive until API runs)
    location /api/ws {
        proxy_pass http://souq_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        access_log /var/log/souq-arab/nginx-api-access.log;
        error_log  /var/log/souq-arab/nginx-api-error.log warn;
    }

    location / {
        root /var/www/souq-foundation/health;
        try_files $uri $uri/ =404;
    }
}
