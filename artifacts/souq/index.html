    <script>
      (function () {
        function isHomePath() {
          var p = location.pathname.replace(/\/$/, "") || "/";
          return p === "/";
        }
        function hasLocale() {
          try {
            return !!localStorage.getItem("app_locale");
          } catch (e) {
            return false;
          }
        }
        function stripHomeShell() {
          var hs = document.getElementById("p7-header-shell");
          if (hs) hs.remove();
          var ly = document.getElementById("p7-lcp-layer");
          if (ly) ly.remove();
          var pl = document.getElementById("p7-lcp-hero-preload");
          if (pl) pl.remove();
          document.documentElement.classList.remove("p7-await-handoff");
        }
        if (!isHomePath()) {
          stripHomeShell();
          var g = document.getElementById("p7-language-gate-shell");
          if (g) g.remove();
          return;
        }
        if (hasLocale()) {
          stripHomeShell();
          var gate = document.getElementById("p7-language-gate-shell");
          if (gate) gate.remove();
          return;
        }
        stripHomeShell();
        var shell = document.getElementById("p7-language-gate-shell");
        if (!shell) return;
        shell.classList.add("p7-lang-gate-visible");
        var selected = "ar";
        try {
          var raw = (navigator.language || "").toLowerCase();
          if (raw.indexOf("en") === 0) selected = "en";
          else if (raw.indexOf("de") === 0) selected = "de";
        } catch (e) {}
        var rows = shell.querySelectorAll(".p7-lang-gate-row");
        function syncRows() {
          for (var i = 0; i < rows.length; i++) {
            var row = rows[i];
            var text = row.textContent || "";
            var on =
              (selected === "ar" && text.indexOf("العربية") >= 0) ||
              (selected === "en" && text.indexOf("English") >= 0) ||
              (selected === "de" && text.indexOf("Deutsch") >= 0);
            row.classList.toggle("p7-lang-gate-row-selected", on);
            row.setAttribute("aria-selected", on ? "true" : "false");
          }
        }
        syncRows();
        for (var r = 0; r < rows.length; r++) {
          (function (row) {
            row.style.cursor = "pointer";
            row.addEventListener("click", function () {
              var text = row.textContent || "";
              if (text.indexOf("English") >= 0) selected = "en";
              else if (text.indexOf("Deutsch") >= 0) selected = "de";
              else selected = "ar";
              syncRows();
            });
          })(rows[r]);
        }
        var confirm = shell.querySelector(".p7-lang-gate-confirm");
        if (confirm) {
          confirm.setAttribute("aria-disabled", "false");
          confirm.setAttribute("tabindex", "0");
          confirm.style.cursor = "pointer";
          function proceed() {
            try {
              localStorage.setItem("app_locale", selected);
            } catch (e) {}
            shell.classList.remove("p7-lang-gate-visible");
            shell.remove();
            document.dispatchEvent(new CustomEvent("p7-locale-saved", { detail: { locale: selected } }));
          }
          confirm.addEventListener("click", proceed);
          confirm.addEventListener("keydown", function (ev) {
            if (ev.key === "Enter" || ev.key === " ") {
              ev.preventDefault();
              proceed();
            }
          });
        }
      })();
