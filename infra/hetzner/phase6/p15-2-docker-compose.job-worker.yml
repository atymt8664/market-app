# P15-2 — STAGING pg-boss job worker (foundation only)

name: souq-arab-p15-job-worker

services:
  job-worker:
    profiles: ["job-worker"]
    image: ${SOUQ_API_IMAGE:-ghcr.io/placeholder/souq-api:latest}
    restart: unless-stopped
    working_dir: /app/artifacts/api-server
    env_file:
      - /opt/souq-arab/config/api.env.staging
    environment:
      JOB_QUEUE_ENABLED: "1"
      JOB_QUEUE_SCHEMA: pgboss
    command:
      [
        "node",
        "--enable-source-maps",
        "/app/artifacts/api-server/dist/worker/job-worker.mjs",
      ]
    mem_limit: 256m
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"process.exit(process.env.JOB_QUEUE_ENABLED==='1'?0:1)\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
