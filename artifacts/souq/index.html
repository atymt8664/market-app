    <noscript>

    <script>
      (function () {
        try {
          var l = localStorage.getItem("app_locale");
          if (l === "en" || l === "de") {
            document.documentElement.lang = l;
            document.documentElement.dir = "ltr";
          }
        } catch (e) {}
      })();
    </script>
    <div id="p7-header-shell" data-p7-pr="12"><!-- P9-E-FIX-A:HEADER_SHELL --></div>
    <script>
      (function () {
        function syncHomeFeedOffsetFromHeaderShell() {
          var p = location.pathname.replace(/\/$/, "") || "/";
          if (p !== "/") return;
          try {
            if (!localStorage.getItem("app_locale")) return;
          } catch (e) {}
          var mount = document.getElementById("p7-header-shell");
          var shell =
            document.querySelector('#p7-header-shell [data-p7-header-shell="1"]') || mount;
          if (!shell) return;
          var h = shell.getBoundingClientRect().height;
          if (h > 0) {
            var px = Math.round(h) + "px";
            document.documentElement.style.setProperty("--p7-home-header-offset", px);
            document.documentElement.style.setProperty("--p7-home-feed-offset", px);
          }
        }
        syncHomeFeedOffsetFromHeaderShell();
        var mount = document.getElementById("p7-header-shell");
        if (mount && typeof ResizeObserver !== "undefined") {
          new ResizeObserver(syncHomeFeedOffsetFromHeaderShell).observe(mount);
        } else if (typeof requestAnimationFrame === "function") {
          requestAnimationFrame(syncHomeFeedOffsetFromHeaderShell);
        }
      })();
    </script>
    <div id="p7-lcp-layer" data-p7-pr="12"><!-- P7-PR-12:LCP_LAYER --></div>
    <div id="p7-bottom-nav-shell-mount" data-p7-pr="12"><!-- P9-3C:BOTTOM_NAV_SHELL --></div>
    <script>
      (function () {
        var p = location.pathname.replace(/\/$/, "") || "/";
        if (p !== "/") {
          var headerShell = document.getElementById("p7-header-shell");
          if (headerShell) headerShell.remove();
          var layer = document.getElementById("p7-lcp-layer");
          if (layer) layer.remove();
          var preload = document.getElementById("p7-lcp-hero-preload");
          if (preload) preload.remove();
          var bottomNavShell = document.getElementById("p7-bottom-nav-shell");
          if (bottomNavShell) bottomNavShell.remove();
          var bottomNavMount = document.getElementById("p7-bottom-nav-shell-mount");
          if (bottomNavMount) bottomNavMount.remove();
          document.documentElement.classList.remove("p7-await-handoff");
          return;
        }
        try {
          if (!localStorage.getItem("app_locale")) {
            var hs = document.getElementById("p7-header-shell");
            if (hs) hs.remove();
            var ly = document.getElementById("p7-lcp-layer");
            if (ly) ly.remove();
            var pl = document.getElementById("p7-lcp-hero-preload");
            if (pl) pl.remove();
            var bns = document.getElementById("p7-bottom-nav-shell");
            if (bns) bns.remove();
            var bnsMount = document.getElementById("p7-bottom-nav-shell-mount");
            if (bnsMount) bnsMount.remove();
            document.documentElement.classList.remove("p7-await-handoff");
          }
        } catch (e) {}
      })();
    </script>
