# Phase 3 — rate limit zones (http context). Tune at cutover if needed.
limit_req_zone $binary_remote_addr zone=souq_api_general:20m rate=40r/s;
limit_req_zone $binary_remote_addr zone=souq_api_auth:10m rate=12r/m;
limit_req_zone $binary_remote_addr zone=souq_api_admin_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=souq_api_upload:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=souq_api_ai:10m rate=40r/m;
limit_conn_zone $binary_remote_addr zone=souq_conn_per_ip:20m;

map $http_user_agent $souq_reject_empty_ua {
    default 0;
    ""      1;
}
